<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#4a0e2e">
<title>Meri Madam Ji Ke Liye ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --bg-deep: #4a0e2e;
    --bg-mid: #7a1443;
    --ink: #fff5f7;
    --ink-dim: #ffc9dc;
    --rose: #ff8fab;
    --gold: #ffd166;
    --heart: #ff5c85;
    --line: rgba(255,245,247,0.18);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: linear-gradient(160deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Starfield ---------- */
  #stars, #stars2, #stars3{
    position:absolute; inset:0;
    background-repeat: repeat;
    pointer-events: none;
  }
  #stars{ background-image: radial-gradient(1.5px 1.5px at var(--x1,20px) var(--y1,30px), #fff, transparent); }

  .twinkle{
    position:absolute;
    border-radius:50%;
    background: #f3ecdf;
    opacity: 0.6;
    animation: tw 4s ease-in-out infinite;
  }
  @keyframes tw{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.9; }
  }

  /* ---------- Ambient glow that shifts per screen ---------- */
  #glow{
    position:absolute; inset:-20%;
    background: radial-gradient(circle at 50% 35%, var(--glow-color,#2a1f4d) 0%, transparent 55%);
    transition: background 1.1s ease;
    pointer-events:none;
    filter: blur(10px);
  }

  /* ---------- Screens ---------- */
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 8vh 8vw;
    text-align:center;
    opacity:0;
    transition: opacity 0.7s ease;
    z-index: 3;
    pointer-events:none;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- Intro ---------- */
  #intro{
    background: linear-gradient(165deg, #ff8fab 0%, #e64980 35%, #b3195c 70%, #6e0f3d 100%);
    z-index: 3;
  }
  #intro h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(2rem, 7.2vw, 3.4rem);
    letter-spacing: 0.02em;
    max-width: 92vw;
    color: #fff5f7;
    text-shadow: 0 2px 18px rgba(194,37,92,0.45);
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn 1.1s ease forwards;
    animation-delay: 0.25s;
    position: relative;
    z-index: 4;
  }
  #intro .tagline{
    margin-top: 1.1rem;
    margin-bottom: 3.2rem;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.05rem, 3.4vw, 1.35rem);
    color: #ffe3ec;
    max-width: 30ch;
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn 1.1s ease forwards;
    animation-delay: 0.75s;
    position: relative;
    z-index: 4;
  }

  @keyframes riseIn{
    to{ opacity:1; transform: translateY(0); }
  }

  .heart-wrap{
    margin: 3.2rem 0 3rem;
    width: 84px; height: 84px;
    position: relative;
    opacity: 0;
    animation: heartIn 1s ease forwards;
    animation-delay: 1.3s;
  }
  @keyframes heartIn{
    to{ opacity:1; }
  }
  .heart-wrap svg{
    width:100%; height:100%;
    filter: drop-shadow(0 0 18px var(--heart)) drop-shadow(0 0 34px rgba(255,111,125,0.55));
    animation: beat 2.4s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{ transform: scale(1); }
    22%{ transform: scale(1.14); }
    38%{ transform: scale(0.97); }
    55%{ transform: scale(1.08); }
  }

  .start-btn{
    font-family:'Jost', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.03em;
    color: #c2255c;
    background: #fff5f7;
    border: none;
    padding: 0.95rem 2.4rem;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(120,10,50,0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    opacity: 0;
    animation: heartIn 1s ease forwards;
    animation-delay: 1.9s;
    position: relative;
    z-index: 4;
  }
  .start-btn:hover{ transform: translateY(-2px); box-shadow: 0 10px 36px rgba(232,167,160,0.4); }
  .start-btn:active{ transform: translateY(0px) scale(0.98); }

  /* ---------- Slide screens ---------- */
  .slide-topic{
    font-family:'Jost', sans-serif;
    font-size: clamp(0.95rem, 2.8vw, 1.15rem);
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    margin-bottom: 1.8rem;
  }
  .slide-topic::before, .slide-topic::after{
    content: "";
  }

  .shayari{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(1.4rem, 4.6vw, 2.25rem);
    line-height: 1.65;
    max-width: min(700px, 90vw);
    color: var(--ink);
    white-space: pre-line;
    text-wrap: balance;
  }

  .typed-text span{
    display: inline-block;
  }

  .caret{
    display:inline-block;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    margin-left: 2px;
    animation: blinkCaret 0.9s steps(1) infinite;
  }
  .caret.done{
    opacity: 0;
    animation: none;
  }
  @keyframes blinkCaret{ 50%{ opacity: 0; } }

  .final .shayari{
    color: #fff2ea;
  }
  .final .slide-topic{ color: var(--gold); }

  .signature{
    margin-top: 2.2rem;
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    color: var(--gold);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .signature.show{ opacity: 1; }

  /* ---------- Progress dots ---------- */
  #dots{
    position:absolute;
    top: 5.5vh;
    left: 50%;
    transform: translateX(-50%);
    display:flex;
    gap: 9px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #dots.show{ opacity:1; }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background: rgba(243,236,223,0.22);
    transition: background 0.35s ease, transform 0.35s ease;
  }
  .dot.filled{ background: var(--rose); }
  .dot.current{ transform: scale(1.5); background: var(--gold); }

  /* ---------- Nav controls ---------- */
  #nav{
    position:absolute;
    bottom: 6vh;
    left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 1.4rem;
    z-index: 5;
    opacity:0;
    transition: opacity 0.5s ease;
  }
  #nav.show{ opacity:1; }

  .nav-btn{
    font-family:'Jost', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    padding: 0.7rem 1.7rem;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease, opacity 0.25s ease;
  }
  .nav-btn:hover{ border-color: var(--rose); background: rgba(232,167,160,0.06); }
  .nav-btn.primary{
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--rose), var(--gold));
    border: none;
  }
  .nav-btn.primary:hover{ opacity:0.92; background: linear-gradient(135deg, var(--rose), var(--gold)); }
  .nav-btn[disabled]{ opacity:0.25; cursor:default; pointer-events:none; }

  .hint{
    position:absolute;
    bottom: 2.3vh;
    left:0; right:0;
    text-align:center;
    font-size: 0.72rem;
    color: var(--ink-dim);
    opacity:0;
    letter-spacing: 0.03em;
    transition: opacity 0.5s ease 0.3s;
  }
  .hint.show{ opacity: 0.55; }

  /* ---------- Floating hearts on intro ---------- */
  #floatHearts{
    position:absolute; inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index: 2;
  }
  #introStars{
    position:absolute; inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index: 0;
  }

  /* ---------- Heart-shaped vignette glow on intro ---------- */
  #heartVignette{
    position:absolute;
    top: 48%;
    left: 50%;
    width: 145vmin;
    height: 132vmin;
    transform: translate(-50%, -50%);
    z-index: -1;
    opacity: 0.42;
    filter: blur(3px);
    pointer-events: none;
    animation: heartVignettePulse 5s ease-in-out infinite;
  }
  #heartVignette svg{ width:100%; height:100%; }
  @keyframes heartVignettePulse{
    0%,100%{ opacity: 0.34; transform: translate(-50%, -50%) scale(1); }
    50%{ opacity: 0.5; transform: translate(-50%, -50%) scale(1.04); }
  }
  .fh{
    position:absolute;
    bottom: -40px;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  .fh svg{ width:100%; height:100%; filter: drop-shadow(0 0 6px rgba(194,37,92,0.25)); }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity: 0.85; }
    85%{ opacity: 0.6; }
    100%{ transform: translateY(-105vh) translateX(var(--drift,20px)) rotate(15deg); opacity:0; }
  }

  @media (max-width: 480px){
    #nav{ gap: 1rem; }
    .nav-btn{ padding: 0.65rem 1.3rem; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="glow"></div>
  <div id="starfield"></div>
  <div id="floatHearts"></div>

  <div id="dots"></div>

  <!-- Intro -->
  <div class="screen active" id="intro">
    <div id="heartVignette">
      <svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="heartGlowGrad" cx="50%" cy="42%" r="62%">
            <stop offset="0%" stop-color="#ffd6e2" stop-opacity="0.9"/>
            <stop offset="45%" stop-color="#e64980" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#6e0f3d" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path fill="url(#heartGlowGrad)" d="M16 28.5 2.6 15.7C-1.8 11.4 0.9 3 7.6 1.6c3.4-0.7 6.9 0.8 8.4 3.8 1.5-3 5-4.5 8.4-3.8 6.7 1.4 9.4 9.8 5 14.1L16 28.5Z"/>
      </svg>
    </div>
    <div id="introStars"></div>
    <h1>Meri Madam Ji Ke Liye 🌸</h1>
    <p class="tagline">Kuch alfaaz, sirf aapke naam... ❤️✨</p>
    <button class="start-btn" id="startBtn">Shuru Karein 💫</button>
  </div>

  <!-- Slides container -->
  <div id="slides"></div>

  <div id="nav">
    <button class="nav-btn" id="prevBtn">Peeche</button>
    <button class="nav-btn primary" id="nextBtn">Aage</button>
  </div>
  <div class="hint" id="swipeHint">swipe ya arrow keys se bhi navigate karein</div>
</div>

<script>
const slidesData = [
  {
    topic: "Pehli Nazar",
    glow: "#ff8fab",
    text: `Pehli nazar mein hi kuch toh baat thi aap mein, ✨
warna dil yun kisi par theherta nahi. 💫
Us din bas aapko dekha tha maine, 👀
par pata nahi kyun, uske baad koi aur itna khoobsurat laga hi nahi. 🌙❤️`
  },
  {
    topic: "Teri Hasi",
    glow: "#ff6f9f",
    text: `Aap jab hansti hain toh waqt sa theher jaata hai, 😊
aapki woh hasi dekh kar dil bas muskuraata hai. 💗
Itni pyaari lagti hai aapki woh muskaan, 🌷
ki dil har baar usi pal mein phir se kho jaata hai. 🫶❤️`
  },
  {
    topic: "Chhoti Chhoti Baatein",
    glow: "#ffb3c6",
    text: `Aapki chhoti-chhoti baaton mein bhi ek alag si mithaas hai, 🍯
shayad isi liye aapki har baat dil ke paas hai. 💌
Baat chahe kitni bhi chhoti kyun na ho, 🌼
aapse judi ho toh mere liye woh khaas hai. 🌸❤️`
  },
  {
    topic: "Ab Toh",
    glow: "#ff5c85",
    text: `Ab toh aapke bina har subah adhuri si lagti hai, 🌅
aapka khayal aaye toh hi din ki shuruaat poori si lagti hai. ☀️
Pata nahi kab itni zaroori ho gayi aap, 💭
ki aapke bina har khushi bhi thodi adhoori si lagti hai. ❤️🌸`
  },
  {
    topic: "Teri Aankhen",
    glow: "#d6336c",
    text: `Aapki aankhon mein ek alag si roshni hai, ✨
jise dekh kar har baar dil mein khushi hai. 💖
Na jaane kya jaadu hai in nazron mein, 🌟
ek pal dekhu toh dil chahe, bas dekhta hi rahun inhe. 👀❤️`
  },
  {
    topic: "Raat Ki Baatein",
    glow: "#7a1454",
    text: `Raat ko aapse hui woh baatein yaad aati hain, 🌌
toh khamosh raaton mein bhi muskaan aa jaati hai. 🌙
Pata nahi kya jaadu hai aapki baaton mein, 💫
jo neend se pehle bhi bas aapki hi yaad aati hai. 🌙❤️`
  },
  {
    topic: "Final Confession",
    glow: "#ff1f6d",
    text: `Pata nahi kab aap meri aadat se badhkar meri zaroorat ban gayi, 💞
kab aapki khushi meri khushi se zyada zaroori ho gayi. 🥺
Aapse kuch paane ki khwahish nahi, 🤍
bas aapke saath kuch khoobsurat pal jeene ki tamanna hai. 🌹
Dil ki jo baatein thi, sab aapke naam kar di, 💌
jo khwahishein thi, woh bhi aapke naam kar di. 💫
Ab aur kya maangu is zindagi se, 🙏
bas aapki ek muskaan apne naam kar di. ❤️`
  },
  {
    topic: "Thank You",
    glow: "#ffd166",
    text: `Thank you… 🥹❤️
Meri zindagi mein aane ke liye 🌸
Meri chhoti chhoti khushiyon ki wajah banne ke liye 🫶✨
Aapne shayad kabhi mehsoos na kiya ho 🥺
Par aapki maujoodgi mere liye bahut maayne rakhti hai ❤️🌙
Bas yunhi meri zindagi ka ek khoobsurat hissa bani rahiye 🌷💫
Aur apni woh pyaari si muskaan hamesha banaye rakhiye 😊❤️
I Love You Soo Much Pooja Ji ❤️🫶🥹🌸`,
    isFinal: true
  }
];

const stage = document.getElementById('stage');
const introScreen = document.getElementById('intro');
const slidesContainer = document.getElementById('slides');
const dotsWrap = document.getElementById('dots');
const navWrap = document.getElementById('nav');
const swipeHint = document.getElementById('swipeHint');
const glow = document.getElementById('glow');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const startBtn = document.getElementById('startBtn');
const starfield = document.getElementById('starfield');
let current = -1; // -1 = intro
let slideEls = [];

// Build stars for the intro/front page
(function buildIntroStars(){
  const wrap = document.getElementById('introStars');
  const count = 55;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'twinkle';
    const size = Math.random()*2.2 + 0.8;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.background = '#ffffff';
    s.style.animationDelay = (Math.random()*4)+'s';
    s.style.animationDuration = (3+Math.random()*3)+'s';
    wrap.appendChild(s);
  }
})();

// Build floating hearts (intro only) — lots of them, varied colors/sizes/speed
(function buildFloatingHearts(){
  const wrap = document.getElementById('floatHearts');
  const colors = ['#ffffff', '#fff0f4', '#ffd1de', '#ff5c85', '#c2255c', '#ffe066'];
  const heartPath = "M16 28.5 2.6 15.7C-1.8 11.4 0.9 3 7.6 1.6c3.4-0.7 6.9 0.8 8.4 3.8 1.5-3 5-4.5 8.4-3.8 6.7 1.4 9.4 9.8 5 14.1L16 28.5Z";
  const flowerSvg = (color) => `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <g fill="${color}">
      <ellipse cx="16" cy="8" rx="5.4" ry="7.4"/>
      <ellipse cx="16" cy="24" rx="5.4" ry="7.4"/>
      <ellipse cx="8" cy="16" rx="7.4" ry="5.4"/>
      <ellipse cx="24" cy="16" rx="7.4" ry="5.4"/>
    </g>
    <circle cx="16" cy="16" r="4.2" fill="#ffe066"/>
  </svg>`;
  const heartSvg = (color) => `<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg"><path fill="${color}" d="${heartPath}"/></svg>`;
  const count = 40;
  for(let i=0;i<count;i++){
    const h = document.createElement('div');
    h.className = 'fh';
    const size = 6 + Math.random()*20;
    const color = colors[Math.floor(Math.random()*colors.length)];
    h.style.width = size+'px';
    h.style.height = size+'px';
    h.style.left = Math.random()*96 + 2 + '%';
    h.style.setProperty('--drift', (Math.random()*80 - 40)+'px');
    h.style.animationDuration = (6 + Math.random()*9)+'s';
    h.style.animationDelay = (Math.random()*9)+'s';
    h.innerHTML = Math.random() < 0.45 ? flowerSvg(color) : heartSvg(color);
    wrap.appendChild(h);
  }
})();

// Build starfield
(function buildStars(){
  const count = 70;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'twinkle';
    const size = Math.random()*2 + 0.6;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*4)+'s';
    s.style.animationDuration = (3+Math.random()*3)+'s';
    starfield.appendChild(s);
  }
})();

// Build slide DOM + dots
slidesData.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'screen slide' + (s.isFinal ? ' final' : '');
  el.innerHTML = `
    <div class="slide-topic">${i+1} / ${slidesData.length} — ${s.topic}</div>
    <div class="shayari"><span class="typed-text"></span><span class="caret">|</span></div>
    ${''}
  `;
  slidesContainer.appendChild(el);
  slideEls.push(el);

  const d = document.createElement('div');
  d.className = 'dot';
  dotsWrap.appendChild(d);
});

function setGlow(color){
  glow.style.setProperty('--glow-color', color);
  stage.style.setProperty('--glow-color', color);
}

let typingToken = 0;

function toGraphemes(str){
  if(typeof Intl !== 'undefined' && Intl.Segmenter){
    const seg = new Intl.Segmenter('en', { granularity: 'grapheme' });
    return Array.from(seg.segment(str), s => s.segment);
  }
  return Array.from(str);
}

function typeShayari(index){
  typingToken++;
  const myToken = typingToken;

  const slideEl = slideEls[index];
  const typedEl = slideEl.querySelector('.typed-text');
  const caretEl = slideEl.querySelector('.caret');
  const sigEl = slideEl.querySelector('.signature');

  const chars = toGraphemes(slidesData[index].text);
  typedEl.innerHTML = '';
  caretEl.classList.remove('done');
  if(sigEl) sigEl.classList.remove('show');

  let i = 0;

  let wordSpan = null;

  function step(){
    if(myToken !== typingToken) return; // a newer typing call has superseded this one

    if(i >= chars.length){
      caretEl.classList.add('done');
      if(sigEl) sigEl.classList.add('show');
      return;
    }

    const ch = chars[i];
    if(ch === '\n'){
      wordSpan = null;
      typedEl.appendChild(document.createTextNode('\n'));
    } else if(ch === ' '){
      wordSpan = null;
      typedEl.appendChild(document.createTextNode(' '));
    } else {
      if(!wordSpan){
        wordSpan = document.createElement('span');
        wordSpan.style.whiteSpace = 'nowrap';
        wordSpan.style.display = 'inline-block';
        typedEl.appendChild(wordSpan);
      }
      const span = document.createElement('span');
      span.textContent = ch;
      wordSpan.appendChild(span);
    }

    i++;
    const delay = ch === ' ' ? 38 : (ch === ',' || ch === '.') ? 120 : 16 + Math.random()*26;
    setTimeout(step, delay);
  }

  step();
}

function updateDots(){
  const dots = dotsWrap.children;
  for(let i=0;i<dots.length;i++){
    dots[i].classList.toggle('filled', i <= current);
    dots[i].classList.toggle('current', i === current);
  }
}

function applySlideChange(index){
  // hide previous
  if(current === -1){
    introScreen.classList.remove('active');
  } else {
    slideEls[current].classList.remove('active');
  }

  current = index;

  if(current === -1){
    introScreen.classList.add('active');
    dotsWrap.classList.remove('show');
    navWrap.classList.remove('show');
    swipeHint.classList.remove('show');
    setGlow('#c2255c');
  } else {
    const s = slidesData[current];
    slideEls[current].classList.add('active');
    dotsWrap.classList.add('show');
    navWrap.classList.add('show');
    swipeHint.classList.add('show');
    setGlow(s.glow);
    updateDots();
    typeShayari(current);

    prevBtn.disabled = current === 0;
    nextBtn.textContent = current === slidesData.length - 1 ? 'Fir Se ✨' : 'Aage';
  }
}

function goTo(index){
  if(index < -1 || index >= slidesData.length) return;
  applySlideChange(index);
}

startBtn.addEventListener('click', () => goTo(0));

nextBtn.addEventListener('click', () => {
  if(current === slidesData.length - 1){
    goTo(0);
  } else {
    goTo(current + 1);
  }
});

prevBtn.addEventListener('click', () => {
  if(current > 0) goTo(current - 1);
});

document.addEventListener('keydown', (e) => {
  if(current === -1) return;
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft' && current > 0) goTo(current - 1);
});

// Swipe support
let touchStartX = 0;
stage.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, {passive:true});

stage.addEventListener('touchend', (e) => {
  if(current === -1) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) < 40) return;
  if(dx < 0) nextBtn.click();
  else if(current > 0) goTo(current - 1);
}, {passive:true});

setGlow('#c2255c');
</script>

</body>
</html>
